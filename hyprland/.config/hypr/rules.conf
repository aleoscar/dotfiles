##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrulev2 = float, onworkspace:special:term, class:(kitty)
windowrulev2 = size 60% 60%, onworkspace:special:term, class:(kitty)
windowrulev2 = center, onworkspace:special:term, class:(kitty)
workspace = special:term, on-created-empty:kitty
workspace = special:term,

windowrulev2 = float, onworkspace:special:other, class:(spotify)
windowrulev2 = size 60% 60%, onworkspace:special:other, class:(spotify)

windowrulev2 = float, class:(blueman-manager)
windowrulev2 = size 600 400, class:(blueman-manager)
windowrulev2 = workspace[+0], title:(blueman-manager)

windowrulev2 = float, title:(iwgtk)
windowrulev2 = size 600 400, title:(iwgtk)
windowrulev2 = workspace[+0], title:(iwgtk)

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
